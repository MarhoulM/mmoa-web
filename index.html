<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>MMOA · Apps and software</title>
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color-scheme: light dark; }
    body { margin: 0; background: #f5f7f5; color: #182821; }
    main { max-width: 42rem; margin: min(12vh, 6rem) auto; padding: 0 1.25rem; }
    .eyebrow { color: #326e57; font-size: .82rem; font-weight: 750; letter-spacing: .13em; text-transform: uppercase; }
    h1 { margin: .5rem 0 0; font-size: clamp(2.6rem, 8vw, 4rem); letter-spacing: -.045em; }
    .lead { margin: .25rem 0 2.5rem; color: #53635b; font-size: 1.15rem; }
    article { padding: clamp(1.4rem, 5vw, 2rem); border: 1px solid #d8e2da; border-radius: 1.25rem; background: #fff; box-shadow: 0 12px 35px #183d2610; }
    h2 { margin: 0 0 .4rem; font-size: 1.55rem; }
    article p { margin: 0 0 1.35rem; color: #53635b; line-height: 1.6; }
    a { color: #126a48; font-weight: 650; text-underline-offset: .2em; }
    a:focus-visible { outline: 3px solid #126a48; outline-offset: 4px; border-radius: 2px; }
    @media (prefers-color-scheme: dark) { body { background: #101b16; color: #edf5ee; } article { background: #192820; border-color: #344b3a; } .lead, article p { color: #b3c6b8; } .eyebrow, a { color: #8de2ae; } a:focus-visible { outline-color: #8de2ae; } }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">MMOA</p>
      <h1>Apps and software</h1>
      <p class="lead">Simple tools for everyday use.</p>
    </header>
    <article aria-labelledby="mathout-title">
      <h2 id="mathout-title">Mathout</h2>
      <p>Practical math and number sense.</p>
      <a href="mathout/privacy/">Mathout Privacy Policy →</a>
    </article>
  </main>
</body>
</html>
